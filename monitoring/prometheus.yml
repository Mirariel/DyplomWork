global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'

  - job_name: 'market-data'
    static_configs:
      - targets: ['market-data:8081']
    metrics_path: '/metrics'

  - job_name: 'trading'
    static_configs:
      - targets: ['trading:8082']
    metrics_path: '/metrics'

  - job_name: 'analytics'
    static_configs:
      - targets: ['analytics:8083']
    metrics_path: '/metrics'
